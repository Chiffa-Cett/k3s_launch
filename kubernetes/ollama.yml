---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ollama

  template:
    metadata:
      labels:
        app: ollama

    spec:
      nodeSelector:
        workload: ollama

      containers:
        - name: ollama
          image: ollama/ollama:0.12.3
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 11434
              name: http

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "6Gi"

          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama

      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-data

---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ai

spec:
  type: ClusterIP

  selector:
    app: ollama

  ports:
    - name: http
      port: 11434
      targetPort: 11434
